<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanReport Admin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --green:#00652C; --green-d:#12512C; --green-l:#B1F2BE; --bg:#FAF8FF; --ink:#1A1B22; --slate:#4B5260; --muted:#7A8190; --line:#E4E4F1; --red:#BA1A1A; --amber:#F59E0B; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  [hidden] { display:none !important; }
  button { font:inherit; cursor:pointer; }
  .btn { background:var(--green); color:#fff; border:0; border-radius:10px; padding:10px 16px; font-weight:700; }
  .btn.alt { background:#E4E4F1; color:var(--ink); }
  .btn:disabled { opacity:.6; cursor:default; }
  input, select, textarea { font:inherit; width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  label { display:block; font-size:13px; font-weight:600; color:var(--slate); margin:12px 0 4px; }

  #login { min-height:100vh; display:grid; place-items:center; padding:20px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 2px 12px rgba(20,20,60,.08); padding:24px; }
  #login .card { width:100%; max-width:380px; }
  #login h1 { margin:0 0 4px; color:var(--green); font-size:24px; }
  .err { color:var(--red); font-size:14px; margin-top:10px; }
  .warn { background:#FFF4D6; color:#6b4500; padding:10px 14px; border-radius:10px; font-size:14px; margin-top:12px; }

  header.top { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 20px; background:#fff; box-shadow:0 1px 6px rgba(20,20,60,.08); position:sticky; top:0; z-index:5; }
  header.top h1 { margin:0; font-size:20px; color:var(--green); margin-right:auto; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; font-size:13px; font-weight:700; background:#E4E4F1; }
  .chip.new { background:var(--green); color:#fff; }
  .layout { display:grid; grid-template-columns: 380px 1fr; gap:16px; padding:16px 20px; align-items:start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .filters button { border:0; border-radius:10px; padding:8px 12px; background:#E4E4F1; font-weight:700; font-size:13px; }
  .filters button.on { background:var(--green); color:#fff; }
  #list { display:flex; flex-direction:column; gap:10px; max-height: calc(100vh - 210px); overflow:auto; padding-right:4px; }
  .item { background:#fff; border-radius:14px; padding:12px; display:flex; gap:12px; cursor:pointer; border:2px solid transparent; box-shadow:0 1px 6px rgba(20,20,60,.06); }
  .item.sel { border-color:var(--green); }
  .item img { width:64px; height:64px; border-radius:10px; object-fit:cover; background:#E4E4F1; flex:none; }
  .item .t { font-weight:700; font-size:15px; line-height:1.25; }
  .item .s { font-size:12.5px; color:var(--muted); margin-top:2px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:800; margin-right:6px; }
  .b-received { background:#FFE3B0; color:#7a4a00; }
  .b-inProgress { background:#CFE0FF; color:#143a8a; }
  .b-done { background:var(--green-l); color:var(--green-d); }
  .pulse { animation: pulse 1.2s ease-out 3; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(0,101,44,.5);} 100% { box-shadow:0 0 0 16px rgba(0,101,44,0);} }

  #detail .photos { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  @media (max-width: 600px) { #detail .photos { grid-template-columns: 1fr; } }
  #detail .photos figure { margin:0; }
  #detail .photos img { width:100%; border-radius:12px; display:block; background:#E4E4F1; max-height:340px; object-fit:cover; }
  #detail figcaption { font-size:12.5px; color:var(--muted); margin-top:4px; }
  #map { height:280px; border-radius:12px; margin-top:14px; }
  dl.kv { display:grid; grid-template-columns: 120px 1fr; gap:6px 12px; margin:14px 0 0; font-size:14.5px; }
  dl.kv dt { color:var(--muted); } dl.kv dd { margin:0; font-weight:600; word-break:break-word; }
  .empty { color:var(--muted); text-align:center; padding:60px 20px; }
  .toast { position:fixed; right:16px; bottom:16px; background:var(--green-d); color:#fff; padding:12px 16px; border-radius:12px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.25); z-index:20; max-width:320px; }
  .toast.bad { background:var(--red); }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>CleanReport Admin</h1>
    <div style="color:var(--slate);font-size:14px">Masuk untuk melihat dan menindaklanjuti laporan warga.</div>
    <div id="cfgwarn" class="warn" hidden>Isi dulu <b>firebaseConfig</b> di bagian atas &lt;script&gt; pada file ini (lihat PANDUAN-V2.md).</div>
    <label for="email">Email admin</label>
    <input id="email" type="email" autocomplete="username">
    <label for="pass">Kata sandi</label>
    <input id="pass" type="password" autocomplete="current-password">
    <div id="loginErr" class="err" hidden></div>
    <button id="loginBtn" class="btn" style="width:100%;margin-top:16px">Masuk</button>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <h1>CleanReport Admin</h1>
    <span class="chip new" id="cNew">0 baru</span>
    <span class="chip" id="cProc">0 diproses</span>
    <span class="chip" id="cDone">0 selesai</span>
    <button class="btn alt" id="soundBtn">🔔 Suara: nyala</button>
    <button class="btn alt" id="csvBtn">Unduh CSV</button>
    <button class="btn alt" id="outBtn">Keluar</button>
  </header>
  <div class="layout">
    <aside>
      <div class="filters" id="filters">
        <button data-f="all" class="on">Semua</button>
        <button data-f="received">Baru</button>
        <button data-f="inProgress">Diproses</button>
        <button data-f="done">Selesai</button>
      </div>
      <input id="search" placeholder="Cari alamat, jenis, atau kode…" style="margin-bottom:10px">
      <div id="list"></div>
    </aside>
    <section class="card" id="detail"><div class="empty">Pilih laporan di sebelah kiri untuk melihat detail.</div></section>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, getDoc, writeBatch, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== ISI DENGAN KONFIGURASI WEB APP FIREBASE ANDA ======
// Firebase Console -> Project settings -> Your apps -> Web app -> SDK setup and configuration

const firebaseConfig = {
  apiKey: "AIzaSyAz0wJwkgc_24VTHfXuDq8RXuOhX8edxB8",
  authDomain: "cleanreport-v2.firebaseapp.com",
  projectId: "cleanreport-v2",
  appId: "1:834726284889:web:17afa963930570b573ab48"
};
// ===========================================================

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const LABEL = { received: "Baru", inProgress: "Diproses", done: "Selesai" };
const NAMES = { received: "Laporan Diterima", inProgress: "Petugas Meluncur", done: "Sudah Bersih" };

if (firebaseConfig.apiKey.startsWith("ISI_")) { $("cfgwarn").hidden = false; }
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let reports = new Map();
let selectedId = null;
let filter = "all";
let firstLoad = true;
let soundOn = true;
let unsub = null;
let mapInstance = null;

function toast(msg, bad = false) {
  const t = $("toast");
  t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 4500);
}
function beep() {
  if (!soundOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(ctx.currentTime + 0.25);
  } catch (e) { /* abaikan */ }
}
const fmtTime = (ts) => ts && ts.toDate ? ts.toDate().toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" }) : "-";
const code = (id) => "#CR-" + String(id).replace(/[^A-Za-z0-9]/g, "").toUpperCase().slice(-5);
// Hanya karakter base64 yang boleh masuk ke atribut src (isian pengguna tidak dipercaya).
const imgSrc = (b64) => (typeof b64 === "string" && /^[A-Za-z0-9+\/=]+$/.test(b64)) ? "data:image/jpeg;base64," + b64 : "";

// ---------- login ----------
$("loginBtn").onclick = async () => {
  $("loginErr").hidden = true;
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
  } catch (e) {
    $("loginErr").textContent = "Gagal masuk: periksa email dan kata sandi.";
    $("loginErr").hidden = false;
  }
};
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
$("outBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) { $("app").hidden = true; $("login").hidden = false; return; }
  try {
    const snap = await getDoc(doc(db, "admins", user.uid));
    if (!snap.exists()) {
      await signOut(auth);
      $("loginErr").textContent = "Akun ini belum terdaftar sebagai admin.";
      $("loginErr").hidden = false;
      return;
    }
  } catch (e) {
    await signOut(auth);
    $("loginErr").textContent = "Tidak bisa memeriksa hak admin (cek aturan Firestore).";
    $("loginErr").hidden = false;
    return;
  }
  $("login").hidden = true; $("app").hidden = false;
  start();
});

// ---------- data realtime ----------
function start() {
  reports = new Map(); firstLoad = true;
  const q = query(collection(db, "reports"), orderBy("createdAt", "desc"), limit(300));
  unsub = onSnapshot(q, (snap) => {
    snap.docChanges().forEach((ch) => {
      const id = ch.doc.id;
      if (ch.type === "removed") { reports.delete(id); return; }
      const d = { id, ...ch.doc.data() };
      reports.set(id, d);
      if (ch.type === "added" && !firstLoad && !ch.doc.metadata.hasPendingWrites) {
        beep(); toast("Laporan baru masuk: " + (d.kategori || "-") + " • " + (d.alamatTeks || ""));
        setTimeout(() => { const el = document.querySelector('[data-id="' + id + '"]'); if (el) el.classList.add("pulse"); }, 50);
      }
    });
    firstLoad = false;
    render();
  }, (err) => toast("Gagal memuat data: " + err.message, true));
}

function counts() {
  let n = 0, p = 0, d = 0;
  reports.forEach((r) => { if (r.status === "done") d++; else if (r.status === "inProgress") p++; else n++; });
  return { n, p, d };
}

function visible() {
  const term = $("search").value.trim().toLowerCase();
  return [...reports.values()].filter((r) => {
    if (filter !== "all" && (r.status || "received") !== filter) return false;
    if (!term) return true;
    return [r.alamatTeks, r.alamatDetail, r.kategori, r.patokanLokasi, code(r.id)].join(" ").toLowerCase().includes(term);
  });
}

function render() {
  const c = counts();
  $("cNew").textContent = c.n + " baru"; $("cProc").textContent = c.p + " diproses"; $("cDone").textContent = c.d + " selesai";
  document.title = (c.n > 0 ? "(" + c.n + ") " : "") + "CleanReport Admin";
  const list = visible();
  $("list").innerHTML = list.length ? list.map((r) => {
    const st = r.status || "received";
    return '<div class="item' + (r.id === selectedId ? " sel" : "") + '" data-id="' + esc(r.id) + '">' +
      '<img alt="" src="' + imgSrc(r.fotoSebelumB64) + '">' +
      '<div><div class="t">' + esc(r.alamatTeks || "Tanpa alamat") + '</div>' +
      '<div class="s"><span class="badge b-' + esc(st) + '">' + esc(LABEL[st] || st) + '</span>' + esc(r.kategori || "-") + '</div>' +
      '<div class="s">' + esc(code(r.id)) + ' • ' + esc(fmtTime(r.createdAt)) + '</div></div></div>';
  }).join("") : '<div class="empty">Belum ada laporan.</div>';
  document.querySelectorAll(".item").forEach((el) => { el.onclick = () => select(el.dataset.id); });
  if (selectedId && reports.has(selectedId)) renderDetail(false);
}

document.querySelectorAll("#filters button").forEach((b) => {
  b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll("#filters button").forEach((x) => x.classList.toggle("on", x === b));
    render();
  };
});
$("search").addEventListener("input", render);
$("soundBtn").onclick = () => { soundOn = !soundOn; $("soundBtn").textContent = "🔔 Suara: " + (soundOn ? "nyala" : "mati"); if (soundOn) beep(); };

function select(id) { selectedId = id; render(); renderDetail(true); }

// ---------- detail ----------
function renderDetail(resetForm) {
  const r = reports.get(selectedId);
  if (!r) return;
  const st = r.status || "received";
  const box = $("detail");
  // jangan menimpa isian formulir yang sedang diketik saat data realtime berubah
  if (!resetForm && box.dataset.id === selectedId && document.activeElement && box.contains(document.activeElement)) return;
  box.dataset.id = selectedId;
  box.innerHTML =
    '<h2 style="margin:0 0 4px">' + esc(code(r.id)) + ' <span class="badge b-' + esc(st) + '">' + esc(NAMES[st] || st) + '</span></h2>' +
    '<div style="color:var(--slate)">' + esc(r.alamatTeks || "") + (r.alamatDetail ? ", " + esc(r.alamatDetail) : "") + '</div>' +
    '<div class="photos" style="margin-top:14px">' +
      '<figure><img alt="Foto sebelum" src="' + imgSrc(r.fotoSebelumB64) + '"><figcaption>Foto laporan warga</figcaption></figure>' +
      '<figure>' + (r.fotoSesudahB64 ? '<img alt="Foto sesudah" src="' + imgSrc(r.fotoSesudahB64) + '">' : '<div class="empty" style="padding:40px 10px;background:#F1F1FA;border-radius:12px">Belum ada foto sesudah</div>') + '<figcaption>Foto setelah dibersihkan</figcaption></figure>' +
    '</div>' +
    '<dl class="kv">' +
      '<dt>Jenis</dt><dd>' + esc(r.kategori || "-") + '</dd>' +
      '<dt>Patokan</dt><dd>' + esc(r.patokanLokasi || "-") + '</dd>' +
      '<dt>Pelapor</dt><dd>' + (r.anonim === false && r.namaPelapor ? esc(r.namaPelapor) : "Anonim") + '</dd>' +
      '<dt>Dilaporkan</dt><dd>' + esc(fmtTime(r.createdAt)) + '</dd>' +
      '<dt>Koordinat</dt><dd>' + esc(r.latitude) + ', ' + esc(r.longitude) + ' • <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r.latitude + "," + r.longitude) + '">Buka di Google Maps</a></dd>' +
    '</dl>' +
    '<div id="map"></div>' +
    '<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">' +
    '<h3 style="margin:0">Tindak lanjut</h3>' +
    '<label for="stSel">Status</label>' +
    '<select id="stSel">' + ["received", "inProgress", "done"].map((k) => '<option value="' + k + '"' + (k === st ? " selected" : "") + '>' + NAMES[k] + '</option>').join("") + '</select>' +
    '<label for="note">Catatan untuk pelapor (opsional)</label>' +
    '<textarea id="note" rows="3" maxlength="300" placeholder="Contoh: Regu 4 menuju lokasi, estimasi 2 jam."></textarea>' +
    '<label for="afterFile">Foto sesudah dibersihkan (opsional)</label>' +
    '<input id="afterFile" type="file" accept="image/*">' +
    '<button id="saveBtn" class="btn" style="margin-top:16px">Simpan perubahan</button>';

  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  const lat = Number(r.latitude), lng = Number(r.longitude);
  if (isFinite(lat) && isFinite(lng)) {
    mapInstance = L.map("map").setView([lat, lng], 17);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(mapInstance);
    L.marker([lat, lng]).addTo(mapInstance);
  }
  $("saveBtn").onclick = () => save(r.id);
}

async function fileToB64(file) {
  const img = await createImageBitmap(file);
  // Satu dokumen Firestore maks. 1 MiB (foto warga + foto sesudah), jadi tiap foto <= 350 KB.
  for (const maxSide of [900, 720, 560]) {
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    for (const q of [0.6, 0.45, 0.3]) {
      const b64 = c.toDataURL("image/jpeg", q).split(",")[1];
      if (b64.length * 0.75 <= 350 * 1024) return b64;
    }
  }
  throw new Error("Foto terlalu besar, pilih foto lain");
}

async function save(id) {
  const btn = $("saveBtn"); btn.disabled = true; btn.textContent = "Menyimpan…";
  try {
    const status = $("stSel").value;
    const note = $("note").value.trim();
    const file = $("afterFile").files[0];
    const now = Timestamp.now();
    const batch = writeBatch(db);
    const upd = { status, updatedAt: now };
    if (file) upd.fotoSesudahB64 = await fileToB64(file);
    batch.update(doc(db, "reports", id), upd);
    batch.set(doc(db, "reports", id, "statusHistory", status), { status, changedAt: now, catatan: note });
    batch.set(doc(db, "public_points", id), { status }, { merge: true });
    await batch.commit();
    toast("Tersimpan. Warga akan melihat perubahan ini di aplikasi.");
    $("detail").dataset.id = "";
  } catch (e) {
    toast("Gagal menyimpan: " + e.message, true);
  }
  const b = $("saveBtn"); if (b) { b.disabled = false; b.textContent = "Simpan perubahan"; }
}

// ---------- CSV ----------
$("csvBtn").onclick = () => {
  const rows = [["kode", "waktu", "status", "jenis", "patokan", "alamat", "latitude", "longitude", "pelapor"]];
  visible().forEach((r) => rows.push([code(r.id), fmtTime(r.createdAt), NAMES[r.status || "received"], r.kategori || "", r.patokanLokasi || "", (r.alamatTeks || "") + (r.alamatDetail ? ", " + r.alamatDetail : ""), r.latitude, r.longitude, r.anonim === false ? (r.namaPelapor || "") : "Anonim"]));
  const csv = rows.map((row) => row.map((v) => '"' + String(v ?? "").replace(/"/g, '""') + '"').join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = "laporan-cleanreport.csv"; a.click();
};
</script>
</body>
</html>
